apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: obser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.9.0
          env:
            - name: ELASTICSEARCH_HOSTS
              value: http://elasticsearch.obser.svc.cluster.local:9200
          ports:
            - containerPort: 5601

---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: obser
spec:
  selector:
    app: kibana
  ports:
    - port: 5601
      targetPort: 5601
