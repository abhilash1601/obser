apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: obser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      volumes:
        - name: backend-config
          configMap:
            name: backend-config
        - name: backend-work
          emptyDir: {}
      initContainers:
        - name: init-backend
          image: node:18-alpine
          command:
            - sh
            - -c
            - cp -R /config/* /work && cd /work && npm install --production
          volumeMounts:
            - name: backend-config
              mountPath: /config
            - name: backend-work
              mountPath: /work
      containers:
        - name: backend
          image: node:18-alpine
          command:
            - sh
            - -c
            - node /work/index.js
          ports:
            - containerPort: 3000
          env:
            - name: OTEL_COLLECTOR_URL
              value: "http://otel-collector.obser.svc.cluster.local:4318/v1/traces"
          volumeMounts:
            - name: backend-work
              mountPath: /work
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: obser
spec:
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
