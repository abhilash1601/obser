apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: obser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      volumes:
        - name: frontend-config
          configMap:
            name: frontend-config
      containers:
        - name: frontend
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: frontend-config
              mountPath: /usr/share/nginx/html
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: obser
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
