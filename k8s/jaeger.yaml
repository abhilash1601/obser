apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: obser
spec:
  ports:
    - port: 14250
      name: jaeger-grpc
  selector:
    app: jaeger

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: obser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.41
          ports:
            - containerPort: 16686
            - containerPort: 14250

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: obser
spec:
  selector:
    app: jaeger
  ports:
    - port: 16686
      targetPort: 16686
      name: query
